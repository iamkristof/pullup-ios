name: Pullup
options:
  bundleIdPrefix: at.pullup
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    DEVELOPMENT_TEAM: 9Z686XN9U2
    MARKETING_VERSION: '1.0'
    CURRENT_PROJECT_VERSION: '1'
targets:
  Pullup:
    type: application
    platform: iOS
    sources: [Pullup]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: at.pullup.ios
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Pullup
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        TARGETED_DEVICE_FAMILY: '1,2'
    scheme:
      testTargets: [PullupTests]
  PullupTests:
    type: bundle.unit-test
    platform: iOS
    sources: [PullupTests]
    dependencies:
      - target: Pullup
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
